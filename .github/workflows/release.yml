name: Release

# Keeps a "version packages" pull request open while there are changesets on main.
# Merging it bumps the version, writes the changelog and publishes to npm.
#
# Paused while the kit is in development and npm isn't set up: it only runs
# when started by hand. To turn it on, replace workflow_dispatch with:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: no npm token needed, and provenance is added automatically.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
