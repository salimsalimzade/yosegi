name: Deploy Storybook

# The Storybook, apps/playground, as the yosegi-storybook Cloudflare Worker
# (static assets only, set up in apps/playground/wrangler.jsonc). main deploys
# to yosegi-storybook.<account>.workers.dev; any other branch or pull request
# uploads a preview at <branch>-yosegi-storybook.<account>.workers.dev.
#
# Paused until the Cloudflare secrets are set up: it only runs when started by
# hand. To turn it on, uncomment push and pull_request.
on:
  push:
    branches: [main]
    paths:
      - "apps/playground/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-storybook.yml"
  pull_request:
    paths:
      - "apps/playground/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-storybook.yml"
  workflow_dispatch:

concurrency:
  group: deploy-storybook-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Secrets aren't available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:storybook
      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: apps/playground
        run: pnpm dlx wrangler@4.151.3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A preview doesn't touch production. Its alias is the branch name, made safe for a hostname.
      - name: Upload a preview
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        working-directory: apps/playground
        run: |
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9]/-/g' -e 's/--*/-/g' | cut -c1-30 | sed 's/^-//; s/-$//')
          pnpm dlx wrangler@4.151.3 versions upload --preview-alias="$alias"
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
