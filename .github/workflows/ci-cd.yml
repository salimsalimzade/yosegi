name: CI/CD

# Checks every push and pull request, then ships what changed:
#
#   deploy   Each site is a Cloudflare Worker that only serves static assets,
#            named in its app's wrangler.jsonc: apps/web is `yosegi`,
#            apps/playground is `yosegi-storybook`. main deploys to
#            <worker>.<account>.workers.dev; any other branch or pull request
#            uploads a preview at <branch>-<worker>.<account>.workers.dev.
#   release  On main, Changesets keeps a "version packages" pull request open
#            while there are changesets. Merging it publishes yosegi-solid to npm.
#
# Both are paused until they're set up. To turn them on, set the repository
# variables: gh variable set DEPLOY --body true
#            gh variable set RELEASE --body true
on:
  pull_request:
  push:
    branches: [main]
  # Started by hand, it deploys both sites.
  workflow_dispatch:

# A newer push cancels the older run, except on main, where runs wait their turn
# so a release is never cut off halfway.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  # Which apps to deploy: the ones whose files, or the kit they compile, changed.
  changes:
    if: vars.DEPLOY == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apps: ${{ github.event_name == 'workflow_dispatch' && '["web","playground"]' || steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # A file counts when it matches every pattern: one of the paths, and none of the release
          # files. A release only bumps the kit's version and changelog, which the sites don't show.
          predicate-quantifier: every
          filters: |
            web:
              - "{apps/web/**,packages/ui/**,pnpm-lock.yaml,.github/workflows/ci-cd.yml}"
              - "!packages/ui/CHANGELOG.md"
              - "!packages/ui/package.json"
            playground:
              - "{apps/playground/**,packages/ui/**,pnpm-lock.yaml,.github/workflows/ci-cd.yml}"
              - "!packages/ui/CHANGELOG.md"
              - "!packages/ui/package.json"

  deploy:
    # GitHub adds the app after the name, as "Deploy (web)", and shows plain "Deploy" when skipped.
    name: Deploy
    needs: [check, changes]
    # Secrets aren't available to pull requests from forks, and the version pull request has nothing
    # to preview.
    if: >-
      needs.changes.outputs.apps != '[]' &&
      github.head_ref != 'changeset-release/main' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.app }} build
      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: apps/${{ matrix.app }}
        run: pnpm dlx wrangler@4.151.3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A preview doesn't touch production. Its alias is the branch name, made safe for a hostname.
      - name: Upload a preview
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        working-directory: apps/${{ matrix.app }}
        run: |
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9]/-/g' -e 's/--*/-/g' | cut -c1-30 | sed 's/^-//; s/-$//')
          pnpm dlx wrangler@4.151.3 versions upload --preview-alias="$alias"
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # With changesets on main, opens or updates the "version packages" pull request. With none left,
  # which is right after that pull request merges, publishes the new version to npm.
  release:
    needs: check
    if: vars.RELEASE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      # npm trusted publishing: no npm token, and provenance is added automatically.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
